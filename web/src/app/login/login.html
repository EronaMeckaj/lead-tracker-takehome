<div class="login-page">
  <div class="login-glow" aria-hidden="true"></div>

  <div class="card elev-lg login-card">
    <span class="brand">Lead Tracker</span>
    <h1>Sign in to the pipeline.</h1>
    <p class="lede">
      Team access only. Enquiries arrive from the public form and are worked here.
    </p>

    <a class="btn btn-secondary btn-block google-btn" [href]="loginUrl">
      <span class="google-badge">G</span>
      Continue with Google
    </a>
    <p class="fine-print">Single sign-on only — no passwords to keep.</p>
  </div>
</div>
