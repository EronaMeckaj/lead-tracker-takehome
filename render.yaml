databases:
  - name: lead-tracker-db
    plan: free
    databaseName: lead_tracker
    user: lead_tracker

services:
  - type: keyvalue
    name: lead-tracker-valkey
    plan: free
    ipAllowList: []

  - type: web
    name: lead-tracker-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install && npm run build && npm run migration:run:prod
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lead-tracker-db
          property: connectionString
      - key: VALKEY_URL
        fromService:
          type: keyvalue
          name: lead-tracker-valkey
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      # Set from the Google Cloud Console — see README.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Comma-separated allowlist — set this, or any Google account can
      # sign in to the dashboard. Never committed.
      - key: ALLOWED_EMAILS
        sync: false
      # Fill in with this service's real onrender.com URL after first deploy.
      - key: GOOGLE_CALLBACK_URL
        value: https://lead-tracker-api.onrender.com/api/auth/google/callback
      # Fill in with the static site's real onrender.com URL after first deploy.
      - key: FRONTEND_URL
        value: https://lead-tracker-web.onrender.com

  - type: web
    name: lead-tracker-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist/web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
