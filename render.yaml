databases:
  - name: lead-tracker-db
    plan: free
    databaseName: lead_tracker
    user: lead_tracker

services:
  - type: keyvalue
    name: lead-tracker-valkey
    plan: free
    ipAllowList: []

  - type: web
    name: lead-tracker-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install && npm run build && npm run migration:run:prod
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render's default build image landed on a Node version the
      # Angular CLI (used transitively via nest build's tooling) doesn't
      # support - pin to what's used in local dev instead of trusting
      # the platform default.
      - key: NODE_VERSION
        value: 22.22.3
      - key: DATABASE_URL
        fromDatabase:
          name: lead-tracker-db
          property: connectionString
      - key: VALKEY_URL
        fromService:
          type: keyvalue
          name: lead-tracker-valkey
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      # Set from the Google Cloud Console — see README.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Comma-separated allowlist — set this, or any Google account can
      # sign in to the dashboard. Never committed.
      - key: ALLOWED_EMAILS
        sync: false
      # Confirmed against the real deployed service - this name didn't
      # collide, so it got the plain onrender.com URL with no suffix.
      - key: GOOGLE_CALLBACK_URL
        value: https://lead-tracker-api.onrender.com/api/auth/google/callback
      - key: FRONTEND_URL
        value: https://lead-tracker-web-t370.onrender.com

  - type: web
    name: lead-tracker-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist/web/browser
    envVars:
      # See the matching comment on lead-tracker-api - the Angular CLI
      # needs a Node version Render's default build image doesn't have.
      - key: NODE_VERSION
        value: 22.22.3
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
